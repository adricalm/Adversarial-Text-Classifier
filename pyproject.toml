[project]
name = "adversarial-text-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lingua-language-detector>=2.2.0",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.5.2",
    "pyarrow>=20.0.0",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

# GPU: install CUDA-enabled wheels (not PyPI's default +cpu build).
# Driver CUDA 12.7 → use cu126; cu128 may need a newer driver.
# Index list: https://pytorch.org/get-started/locally/
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
